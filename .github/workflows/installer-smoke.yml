name: Installer smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Fetch pinned ExileCore2 build reference
        shell: pwsh
        run: |
          $reference = Join-Path $env:RUNNER_TEMP "exilecore2-reference"
          New-Item -ItemType Directory -Force -Path $reference | Out-Null
          $assembly = Join-Path $reference "ExileCore2.dll"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/exCore2/ExileCore2/435c0b4ed2dc66eb166dcb8b66de6b089c8cbd29/ExileCore2.dll" -OutFile $assembly
          if ((Get-FileHash $assembly -Algorithm SHA256).Hash -ne "F21CD2F34927ADD94293153D6DDC2B9404420121620D3F31247B230879F4CB1A") { throw "ExileCore2 reference hash differs" }
      - name: Build one Windows installer
        shell: pwsh
        run: |
          python scripts/build_installer.py --exilecore2-dir "$env:RUNNER_TEMP/exilecore2-reference" --version "0.0.0-ci.${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and uninstall silently
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem installer/out/PartyPilot-Setup-*.exe)
          if ($setup.Count -ne 1) { throw "Expected one setup executable" }
          $target = Join-Path $env:RUNNER_TEMP "PartyPilotInstalled"
          & $setup[0].FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$target"
          if ($LASTEXITCODE -ne 0) { throw "Installer returned $LASTEXITCODE" }
          foreach ($file in @(
            "desktop/PartyPilot.Desktop.exe",
            "bridge/PartyPilot.Bridge.exe",
            "probe/PartyPilot.Probe.exe",
            "PartyPilot-LiveFollow.exe",
            "PartyPilot-ClientLaunch.exe",
            "native/PartyPilot.PrivateSlots.dll",
            "native/PartyPilot.MultiInstance.dll",
            "sensor-plugin/PartyPilot.Sensor/PartyPilot.Sensor.dll"
          )) {
            if (-not (Test-Path (Join-Path $target $file))) { throw "Installed file missing: $file" }
          }
          $shortcut = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/PartyPilot/PartyPilot.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing" }
          $uninstall = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }
          & $uninstall /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller returned $LASTEXITCODE" }
          if (Test-Path (Join-Path $target "desktop/PartyPilot.Desktop.exe")) { throw "Uninstall left the desktop program" }
      - name: Save installer for review
        uses: actions/upload-artifact@v4
        with:
          name: PartyPilot-Setup-preview
          path: installer/out/PartyPilot-Setup-*.exe
          if-no-files-found: error
